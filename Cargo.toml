[package]
name = "database-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "uuid",      # <-- This is the crucial feature for UUID support
    "chrono",     # <-- This is for TIMESTAMPTZ support
    "json"
] }
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = [
    "v4",        # To generate new UUIDs
    "serde"      # Good practice for serialization
] }
thiserror = "2.0.17"
serde = "1.0.228"
domain = { path = "../domain" }
